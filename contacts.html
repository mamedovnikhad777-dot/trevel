<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Контакты тур агентства: телефон, адрес, форма обратной связи и карта. Сыктывкар, ул. Первомайская, 1.">
    <meta name="theme-color" content="#df3d72">
    <title>Контакты — Тур агентство</title>
    <link rel="preconnect" href="https://www.google.com">
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo" aria-label="Тур агентство — на главную">
                <img src="./imgs/Лого 2.svg" alt="Тур агентство" class="logo-img" width="120" height="60">
            </a>
            <nav class="nav" aria-label="Основная навигация">
                <a href="index.html">Главная</a>
                <a href="not-ready.html">Экскурсии</a>
                <a href="routes.html">Маршруты</a>
                <a href="contacts.html" aria-current="page">О нас</a>
            </nav>
            <div class="auth-buttons">
                <a href="login.html" class="btn btn-outline">Войти</a>
                <a href="routes.html" class="btn btn-primary">Найти поездку</a>
            </div>
        </div>
    </header>

    <main class="container">
        <nav class="breadcrumbs" aria-label="Хлебные крошки">
            <a href="index.html">Главная</a> / О нас
        </nav>

        <h1 class="section-title section-title--center">Контакты</h1>

        <div class="contacts-grid">
            <div class="contact-info">
                <p><strong>Телефон:</strong> +7 (907) 890-90-70</p>
                <p><strong>Адрес:</strong> г. Сыктывкар, ул. Первомайская, 1</p>
                <p><strong>Режим:</strong><br>Пн–Пт 8:00–22:00<br>Сб–Вс 9:00–20:00</p>
            </div>
            <div>
                <form action="index.html" method="GET">
                    <div class="form-group">
                        <input type="text" name="name" class="form-control" placeholder="Имя" aria-label="Имя" autocomplete="name" required>
                    </div>
                    <div class="form-group">
                        <input type="tel" name="phone" class="form-control" placeholder="Телефон" aria-label="Телефон" autocomplete="tel" required>
                    </div>
                    <div class="form-group">
                        <textarea name="message" class="form-control" rows="4" placeholder="Сообщение" aria-label="Сообщение" required></textarea>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="agree" name="agree" required>
                        <label for="agree">Даю согласие на обработку ПД</label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-large btn-block">Отправить</button>
                </form>
            </div>
        </div>

        <div class="map-placeholder">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1893.1721280034644!2d50.82078317748097!3d61.67314552125576!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x43f62b2d7759fdbf%3A0x91112cd67ca32d8e!2sGpou%20%22Stek%22!5e0!3m2!1sen!2sru!4v1791359950030!5m2!1sen!2sru"
                title="Карта расположения офиса"
                width="600" height="450"
                allowfullscreen loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-inner">
                <nav class="footer-nav" aria-label="Навигация в подвале">
                    <a href="index.html">Главная</a>
                    <a href="not-ready.html">Экскурсии</a>
                    <a href="routes.html">Маршруты</a>
                    <a href="contacts.html">О нас</a>
                </nav>
                <div class="footer-info">
                    <strong>+79078909070</strong>
                    <span>г. Сыктывкар, Первомайская 1</span>
                </div>
                <div class="footer-contacts">
                    <div class="footer-social">
                        <a href="https://t.me" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
                            <img src="./imgs/Telegram App.svg" alt="Telegram" width="32" height="32" loading="lazy" decoding="async">
                        </a>
                        <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
                            <img src="./imgs/YouTube.svg" alt="YouTube" width="32" height="32" loading="lazy" decoding="async">
                        </a>
                    </div>
                    <p class="footer-copyright">© 2026 Тур агентство</p>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
