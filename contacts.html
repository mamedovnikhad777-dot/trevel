<!DOCTYPE html>
<html lang="ru">

    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <img src="./imgs/Лого 2.svg" alt="Логотип" class="logo-img">
            </a>
            <nav class="nav">
                <a href="index.html">Главная</a>
                <a href="not-ready.html">Экскурсии</a>
                <a href="routes.html">Маршруты</a>

            </nav>
            <div class="auth-buttons">
                <a href="login.html" class="btn btn-outline">Войти</a>
                <a href="routes.html" class="btn btn-primary">Найти поездку</a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="breadcrumbs">
            <a href="index.html">Главная</a> / О нас
        </div>

        <h1 class="section-title" style="text-align: center; margin-top: 20px;">Контакты</h1>

        <div class="contacts-grid">
            <div class="contact-info">
                <p><strong>Телефон:</strong> +7 (907) 890-90-70</p>
                <p><strong>Адрес:</strong> г. Сыктывкар, ул. Первомайская, 1</p>
                <p><strong>Режим:</strong><br>Пн–Пт 8:00–22:00<br>Сб–Вс 9:00–20:00</p>
            </div>
            <div>
                <form action="index.html" method="GET">
                    <div class="form-group">
                        <input type="text" class="form-control" placeholder="Имя" required>
                    </div>
                    <div class="form-group">
                        <input type="tel" class="form-control" placeholder="Телефон" required>
                    </div>
                    <div class="form-group">
                        <textarea class="form-control" rows="4" placeholder="Сообщение" required></textarea>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="agree" required>
                        <label for="agree">Даю согласие на обработку ПД</label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-large" style="width: 100%;" disabled>Отправить</button>
                </form>
            </div>
        </div>

        <div class="map-placeholder">
            Карта
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-inner">

                <div class="footer-info">
                    <strong>+79078909070</strong>
                    <span>г.Сыктывкар, Первомайская 1</span>
                </div>
                <div class="footer-contacts">
                    <div class="footer-social">
                        <a href="https://t.me" target="_blank" rel="noopener"><img src="./imgs/Telegram App.svg" alt="Telegram"></a>

                    <div class="footer-copyright">

                    </div>
