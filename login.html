<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Вход в личный кабинет тур агентства. Авторизуйтесь, чтобы бронировать маршруты и управлять поездками.">
    <meta name="theme-color" content="#df3d72">
    <title>Вход — Тур агентство</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo" aria-label="Тур агентство — на главную">
                <img src="./imgs/Лого 2.svg" alt="Тур агентство" class="logo-img" width="120" height="60">
            </a>
            <nav class="nav" aria-label="Основная навигация">
                <a href="index.html">Главная</a>
                <a href="not-ready.html">Экскурсии</a>
                <a href="routes.html">Маршруты</a>
                <a href="contacts.html">О нас</a>
            </nav>
            <div class="auth-buttons">
                <a href="login.html" class="btn btn-outline">Войти</a>
                <a href="routes.html" class="btn btn-primary">Найти поездку</a>
            </div>
        </div>
    </header>

    <main class="container">
        <nav class="breadcrumbs" aria-label="Хлебные крошки">
            <a href="index.html">Главная</a> / Вход
        </nav>

        <div class="form-container">
            <h1 class="form-title">Вход</h1>
            <form action="index.html" method="GET">
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="Логин" aria-label="Логин" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <input type="password" class="form-control" placeholder="Пароль" aria-label="Пароль" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-large btn-block">Отправить</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-inner">
                <nav class="footer-nav" aria-label="Навигация в подвале">
                    <a href="index.html">Главная</a>
                    <a href="not-ready.html">Экскурсии</a>
                    <a href="routes.html">Маршруты</a>
                    <a href="contacts.html">О нас</a>
                </nav>
                <div class="footer-info">
                    <strong>+79078909070</strong>
                    <span>г. Сыктывкар, Первомайская 1</span>
                </div>
                <div class="footer-contacts">
                    <div class="footer-social">
                        <a href="https://t.me" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
                            <img src="./imgs/Telegram App.svg" alt="Telegram" width="32" height="32" loading="lazy" decoding="async">
                        </a>
                        <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
                            <img src="./imgs/YouTube.svg" alt="YouTube" width="32" height="32" loading="lazy" decoding="async">
                        </a>
                    </div>
                    <p class="footer-copyright">© 2026 Тур агентство</p>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
